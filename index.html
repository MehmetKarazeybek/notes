<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doğum Günün Kutlu Olsun Kraliçe!</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #050507;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        .font-serif-luxury {
            font-family: 'Cinzel', serif;
        }

        .font-cursive {
            font-family: 'Great Vibes', cursive;
        }

        /* Lüks Rose Gold & Şampanya Gradient Metin */
        .rose-gold-text {
            background: linear-gradient(135deg, #ffffff 0%, #f7d6c8 30%, #e5b3a3 60%, #c58b7b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.9));
        }

        /* Yumuşak Parlak Metin Gölgesi */
        .text-glow {
            text-shadow: 0 0 20px rgba(229, 179, 163, 0.3), 0 0 35px rgba(0, 0, 0, 0.9);
        }

        /* Orijinal Havalı Çerçeve & Parıltı Efekti */
        .frame-glow {
            box-shadow: 0 0 35px rgba(229, 179, 163, 0.15), 0 20px 50px rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(229, 179, 163, 0.3);
        }

        /* Fotoğraf Yağmuru Animasyonu */
        @keyframes floatDown {
            0% {
                transform: translateY(-110px) rotate(-10deg) scale(0.9);
                opacity: 0;
            }
            12% {
                opacity: 0.95;
            }
            50% {
                transform: translateY(50vh) rotate(15deg) scale(1.02);
            }
            88% {
                opacity: 0.95;
            }
            100% {
                transform: translateY(108vh) rotate(360deg) scale(0.95);
                opacity: 0;
            }
        }

        .falling-photo {
            position: absolute;
            top: -120px;
            pointer-events: none;
            animation: floatDown linear infinite;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 4px 12px 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8), 0 0 15px rgba(229, 179, 163, 0.2);
            border: 1px solid rgba(229, 179, 163, 0.4);
            object-fit: cover;
            z-index: 10;
        }

        /* Mum Alevi Gerçekçi Titreme Animasyonu */
        @keyframes flicker {
            0%, 100% {
                transform: scale(1) rotate(-1.5deg);
                opacity: 0.98;
                filter: drop-shadow(0 0 12px #ff8800) drop-shadow(0 0 25px #ff3300);
            }
            25% {
                transform: scale(1.1) rotate(2deg);
                opacity: 0.92;
                filter: drop-shadow(0 0 18px #ffaa00) drop-shadow(0 0 30px #ff2200);
            }
            50% {
                transform: scale(0.97) rotate(-1deg);
                opacity: 0.96;
            }
            75% {
                transform: scale(1.14) rotate(2.5deg);
                opacity: 1;
                filter: drop-shadow(0 0 22px #ffbb00) drop-shadow(0 0 35px #ff1100);
            }
        }

        .flame {
            animation: flicker 0.45s infinite alternate ease-in-out;
            transform-origin: center bottom;
        }

        /* Pasta Işıltısı ve Hover Efekti */
        .cake-glow {
            filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.95)) drop-shadow(0 10px 30px rgba(197, 139, 123, 0.2));
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cake-glow:hover {
            transform: scale(1.04) translateY(-6px);
            cursor: pointer;
        }

        /* Sayfa Geçiş Animasyonları */
        .intro-fade-out {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.2s ease, visibility 1.2s ease;
        }

        .main-stage-in {
            opacity: 1;
            transform: scale(1);
            transition: opacity 1.5s ease, transform 1.2s ease;
        }
    </style>
</head>
<body class="relative flex items-center justify-center min-h-screen bg-black">

    <!-- Müzik dosyası: müzik.mp3 -->
    <audio id="bg-music" loop preload="auto">
        <source src="müzik.mp3" type="audio/mpeg">
        Tarayıcınız ses öğesini desteklemiyor.
    </audio>

    <!-- Giriş Ekranı (Blur Kaldırıldı, Orijinal Çerçeve & Fotoğraf Boyutu Korundu) -->
    <div id="intro-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#050507] p-3 text-center cursor-pointer">
        
        <!-- Net ve Keskin Kutusu (Blursuz) -->
        <div class="max-w-xl w-full p-6 md:p-8 rounded-3xl bg-zinc-950 border border-rose-200/20 shadow-[0_0_80px_rgba(0,0,0,0.95)] space-y-5 transform transition duration-500 hover:scale-[1.01] flex flex-col items-center justify-between">
            
            <div class="inline-block px-4 py-1.5 rounded-full border border-rose-300/30 bg-rose-500/10 text-rose-200 text-xs tracking-[0.25em] uppercase animate-pulse">
                👑 Özel Doğum Günü Tebriği 👑
            </div>

            <!-- Orijinal Boyutlardaki Lüks Rose Gold Çerçeve -->
            <div class="relative p-1 rounded-2xl bg-gradient-to-tr from-rose-900/40 via-rose-200/50 to-amber-100/30 frame-glow max-w-full">
                <div class="bg-zinc-950 p-2 rounded-xl overflow-hidden flex items-center justify-center">
                    <img src="arka.png" alt="Kraliçe Görseli" class="max-h-[320px] sm:max-h-[360px] w-auto object-contain rounded-lg shadow-inner" onerror="this.style.display='none'">
                </div>
            </div>

            <h1 class="text-3xl sm:text-4xl font-serif-luxury rose-gold-text leading-tight tracking-wide font-extrabold text-glow">
                Doğum günün kutlu olsun Kraliçe!
            </h1>

            <p class="text-2xl sm:text-3xl font-cursive text-rose-100/90 tracking-wider text-glow">
                Nice sağlıklı, huzurlu ve güzelliklerle dolu güzel senelere... ✨
            </p>

            <div class="pt-1">
                <button id="start-btn" class="px-9 py-3 rounded-full border border-rose-300/40 bg-gradient-to-r from-rose-900/40 via-rose-800/20 to-rose-900/40 hover:from-rose-800/60 hover:to-rose-700/60 text-rose-100 hover:text-white font-medium transition duration-300 shadow-xl shadow-rose-950/50 text-xs tracking-[0.2em] uppercase">
                    Kutlamayı Başlat 🎉
                </button>
            </div>
        </div>
    </div>

    <!-- Fotoğraf Yağmuru Konteyneri -->
    <div id="photo-rain-container" class="fixed inset-0 pointer-events-none z-10 overflow-hidden"></div>

    <!-- Ana Sahne & Gerçekçi Havalı Pasta -->
    <main id="main-stage" class="relative z-20 flex flex-col items-center justify-center opacity-0 scale-95 transition-all duration-1000 p-4 text-center min-h-screen">
        
        <!-- Üst Başlık -->
        <div class="mb-4 space-y-2">
            <h2 class="text-3xl md:text-5xl font-cursive rose-gold-text drop-shadow-[0_5px_20px_rgba(0,0,0,0.9)]">
                İyi ki Doğdun Kraliçe! 👑✨
            </h2>
            <p class="text-[10px] md:text-xs text-rose-200/70 tracking-[0.2em] uppercase font-light">
                (Dileğinizi tutun ve pastanın üzerine dokunun)
            </p>
        </div>

        <!-- Ultra Detaylı Havalı & Gerçekçi Pasta (SVG) -->
        <div id="cake-container" class="cake-glow relative my-2 cursor-pointer">
            <svg width="420" height="440" viewBox="0 0 420 440" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-64 sm:w-80 md:w-[420px] h-auto">
                
                <!-- Zemin Derin Gölgeleri -->
                <ellipse cx="210" cy="405" rx="180" ry="22" fill="#000000" opacity="0.85"/>
                <ellipse cx="210" cy="398" rx="150" ry="15" fill="#000000" opacity="0.6"/>

                <!-- Lüks Kristal / Şampanya Altın Stand -->
                <ellipse cx="210" cy="390" rx="170" ry="24" fill="url(#plate-gradient)" stroke="url(#rose-gold-border)" stroke-width="2.5"/>
                <ellipse cx="210" cy="384" rx="158" ry="18" fill="url(#plate-inner)"/>

                <!-- KAT 1: Alt Kat -->
                <g id="tier-1">
                    <path d="M55 285 C55 285 55 365 210 365 C365 365 365 285 365 285 L365 350 C365 370 210 385 55 350 Z" fill="#120508"/>
                    <rect x="55" y="275" width="310" height="85" rx="18" fill="url(#chocolate-dark)"/>
                    <ellipse cx="210" cy="275" rx="155" ry="22" fill="#2d0d15"/>
                    
                    <path d="M55 278 Q75 315 105 285 Q130 325 160 282 Q185 330 210 288 Q235 330 260 282 Q290 320 315 285 Q335 310 365 278 L365 270 L55 270 Z" fill="url(#ganache-drip)" filter="drop-shadow(0 5px 8px rgba(0,0,0,0.8))"/>

                    <g fill="url(#pearl-rose)">
                        <circle cx="85" cy="342" r="5"/><circle cx="115" cy="349" r="5"/>
                        <circle cx="145" cy="354" r="5.5"/><circle cx="178" cy="357" r="6"/>
                        <circle cx="210" cy="358" r="6.5"/><circle cx="242" cy="357" r="6"/>
                        <circle cx="275" cy="354" r="5.5"/><circle cx="305" cy="349" r="5"/>
                        <circle cx="335" cy="342" r="5"/>
                    </g>
                </g>

                <!-- KAT 2: Orta Kat -->
                <g id="tier-2">
                    <path d="M90 195 C90 195 90 265 210 265 C330 265 330 195 330 195 L330 255 C330 273 210 285 90 255 Z" fill="#2b0912"/>
                    <rect x="90" y="185" width="240" height="80" rx="16" fill="url(#rose-velvet)"/>
                    <ellipse cx="210" cy="185" rx="120" ry="18" fill="#5e182a"/>

                    <path d="M90 190 Q115 220 140 192 Q165 228 190 195 Q220 230 245 192 Q275 220 300 190 Q315 210 330 190 L330 182 L90 182 Z" fill="url(#white-cream)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.6))"/>

                    <path d="M100 215 Q210 240 320 215" stroke="url(#rose-gold-border)" stroke-width="2" stroke-dasharray="6 4" opacity="0.85"/>
                    <path d="M110 235 Q210 260 310 235" stroke="url(#rose-gold-border)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>

                    <circle cx="150" cy="228" r="5" fill="#ffffff" stroke="#c58b7b" stroke-width="1.5"/>
                    <circle cx="210" cy="240" r="6.5" fill="#f7d6c8" stroke="#ffffff" stroke-width="2" filter="drop-shadow(0 0 10px #e5b3a3)"/>
                    <circle cx="270" cy="228" r="5" fill="#ffffff" stroke="#c58b7b" stroke-width="1.5"/>
                </g>

                <!-- KAT 3: Üst Kat -->
                <g id="tier-3">
                    <rect x="125" y="105" width="170" height="80" rx="14" fill="url(#royal-burgundy)"/>
                    <ellipse cx="210" cy="105" rx="85" ry="14" fill="#7a1c33"/>

                    <path d="M125 110 Q145 135 168 112 Q190 142 210 115 Q230 140 252 112 Q275 135 295 110 L295 100 L125 100 Z" fill="url(#ganache-drip)" filter="drop-shadow(0 3px 5px rgba(0,0,0,0.7))"/>

                    <path d="M165 152 L175 164 L210 138 L245 164 L255 152 L238 172 L182 172 Z" fill="url(#rose-gold-border)" opacity="0.9" filter="drop-shadow(0 2px 5px rgba(0,0,0,0.8))"/>
                    <circle cx="210" cy="138" r="3" fill="#ffffff"/>
                    <circle cx="165" cy="152" r="2.5" fill="#ffffff"/>
                    <circle cx="255" cy="152" r="2.5" fill="#ffffff"/>
                </g>

                <!-- MUMLAR & ALEVLER -->
                <g id="candle-left">
                    <rect x="158" y="52" width="12" height="55" rx="4" fill="url(#candle-rose)"/>
                    <line x1="164" y1="52" x2="164" y2="42" stroke="#151515" stroke-width="2.5"/>
                    <g class="flame" style="transform-origin: 164px 40px;">
                        <ellipse cx="164" cy="28" rx="7" ry="15" fill="#ff6600"/>
                        <ellipse cx="164" cy="31" rx="4" ry="10" fill="#ffcc00"/>
                        <ellipse cx="164" cy="34" rx="2" ry="5" fill="#ffffff"/>
                    </g>
                </g>

                <g id="candle-center">
                    <rect x="203" y="35" width="14" height="72" rx="4" fill="url(#candle-gold)"/>
                    <line x1="210" y1="35" x2="210" y2="22" stroke="#101010" stroke-width="3"/>
                    <g class="flame" style="animation-delay: -0.2s; transform-origin: 210px 20px;">
                        <ellipse cx="210" cy="8" rx="9.5" ry="19" fill="#ff4400"/>
                        <ellipse cx="210" cy="11" rx="5.5" ry="13" fill="#ffbb00"/>
                        <ellipse cx="210" cy="15" rx="2.5" ry="6" fill="#ffffff"/>
                    </g>
                </g>

                <g id="candle-right">
                    <rect x="250" y="52" width="12" height="55" rx="4" fill="url(#candle-rose)"/>
                    <line x1="256" y1="52" x2="256" y2="42" stroke="#151515" stroke-width="2.5"/>
                    <g class="flame" style="animation-delay: -0.35s; transform-origin: 256px 40px;">
                        <ellipse cx="256" cy="28" rx="7" ry="15" fill="#ff6600"/>
                        <ellipse cx="256" cy="31" rx="4" ry="10" fill="#ffcc00"/>
                        <ellipse cx="256" cy="34" rx="2" ry="5" fill="#ffffff"/>
                    </g>
                </g>

                <!-- SVG Gradient Tanımlamaları -->
                <defs>
                    <linearGradient id="plate-gradient" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#0d0d12"/>
                        <stop offset="30%" stop-color="#2a2228"/>
                        <stop offset="50%" stop-color="#54434f"/>
                        <stop offset="70%" stop-color="#2a2228"/>
                        <stop offset="100%" stop-color="#0d0d12"/>
                    </linearGradient>

                    <linearGradient id="plate-inner" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#221a20"/>
                        <stop offset="100%" stop-color="#080709"/>
                    </linearGradient>

                    <linearGradient id="chocolate-dark" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#2a0a12"/>
                        <stop offset="50%" stop-color="#4d1222"/>
                        <stop offset="100%" stop-color="#1a040a"/>
                    </linearGradient>

                    <linearGradient id="ganache-drip" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#5c1928"/>
                        <stop offset="50%" stop-color="#3d0e19"/>
                        <stop offset="100%" stop-color="#21050c"/>
                    </linearGradient>

                    <linearGradient id="rose-velvet" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#6e192f"/>
                        <stop offset="50%" stop-color="#992945"/>
                        <stop offset="100%" stop-color="#4a0f1d"/>
                    </linearGradient>

                    <linearGradient id="royal-burgundy" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#8a1c36"/>
                        <stop offset="50%" stop-color="#b82a4d"/>
                        <stop offset="100%" stop-color="#590e21"/>
                    </linearGradient>

                    <linearGradient id="white-cream" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="60%" stop-color="#fceee9"/>
                        <stop offset="100%" stop-color="#e3c2b8"/>
                    </linearGradient>

                    <linearGradient id="rose-gold-border" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#c58b7b"/>
                        <stop offset="50%" stop-color="#f7d6c8"/>
                        <stop offset="100%" stop-color="#a86e5e"/>
                    </linearGradient>

                    <radialGradient id="pearl-rose" cx="30%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="40%" stop-color="#e5b3a3"/>
                        <stop offset="100%" stop-color="#8a5345"/>
                    </radialGradient>

                    <linearGradient id="candle-rose" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#a86e5e"/>
                        <stop offset="50%" stop-color="#f7d6c8"/>
                        <stop offset="100%" stop-color="#8a5345"/>
                    </linearGradient>

                    <linearGradient id="candle-gold" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="50%" stop-color="#f7d6c8"/>
                        <stop offset="100%" stop-color="#d49b8c"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <!-- Müzik ve Kontrol Butonları -->
        <div class="mt-4 flex items-center justify-center gap-3 z-30">
            <button id="music-toggle" class="px-4 py-2 rounded-full bg-rose-500/10 border border-rose-300/20 text-rose-200 hover:bg-rose-500/20 transition flex items-center gap-2 text-xs md:text-sm">
                <svg id="music-icon-on" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zm12 0c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                <svg id="music-icon-off" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
                <span id="music-text">Müziği Durdur</span>
            </button>
            <button id="replay-btn" class="px-4 py-2 rounded-full bg-rose-500/10 border border-rose-300/20 text-rose-200 text-xs md:text-sm hover:bg-rose-500/20 transition">
                Girişi Tekrar Gör
            </button>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const introScreen = document.getElementById('intro-screen');
            const startBtn = document.getElementById('start-btn');
            const mainStage = document.getElementById('main-stage');
            const bgMusic = document.getElementById('bg-music');
            const cakeContainer = document.getElementById('cake-container');
            const photoContainer = document.getElementById('photo-rain-container');
            const musicToggle = document.getElementById('music-toggle');
            const musicIconOn = document.getElementById('music-icon-on');
            const musicIconOff = document.getElementById('music-icon-off');
            const musicText = document.getElementById('music-text');
            const replayBtn = document.getElementById('replay-btn');

            const photoList = ['fotograf.png', 'foto2.png', 'foto3.png'];

            let isPlayingMusic = false;
            let photoRainInterval = null;

            function tryAutoPlay() {
                bgMusic.play().then(() => {
                    isPlayingMusic = true;
                    updateMusicIcons();
                }).catch(() => {
                    isPlayingMusic = false;
                    updateMusicIcons();
                });
            }

            tryAutoPlay();

            function startCelebration() {
                introScreen.classList.add('intro-fade-out');
                
                if (!isPlayingMusic) {
                    bgMusic.play().then(() => {
                        isPlayingMusic = true;
                        updateMusicIcons();
                    }).catch(err => console.log("Ses hatası:", err));
                }

                setTimeout(() => {
                    introScreen.style.display = 'none';
                    mainStage.classList.remove('opacity-0', 'scale-95');
                    mainStage.classList.add('main-stage-in');

                    startPhotoRain();
                    triggerConfetti();
                }, 1000);
            }

            function updateMusicIcons() {
                if (isPlayingMusic) {
                    musicIconOn.classList.remove('hidden');
                    musicIconOff.classList.add('hidden');
                    musicText.textContent = "Müziği Durdur";
                } else {
                    musicIconOn.classList.add('hidden');
                    musicIconOff.classList.remove('hidden');
                    musicText.textContent = "Müziği Başlat";
                }
            }

            musicToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isPlayingMusic) {
                    bgMusic.pause();
                    isPlayingMusic = false;
                } else {
                    bgMusic.play();
                    isPlayingMusic = true;
                }
                updateMusicIcons();
            });

            // Azaltılmış Sıklıkta Fotoğraf Yağmuru (1200ms)
            function startPhotoRain() {
                if (photoRainInterval) clearInterval(photoRainInterval);

                photoRainInterval = setInterval(() => {
                    createFallingPhoto();
                }, 1200);
            }

            function createFallingPhoto() {
                const img = document.createElement('img');
                const randomPhoto = photoList[Math.floor(Math.random() * photoList.length)];
                img.src = randomPhoto;
                
                img.onerror = () => {
                    img.src = `https://placehold.co/150x190/2b0912/e5b3a3?text=Kraliçe+✨`;
                };
                
                img.classList.add('falling-photo');

                // Küçültülmüş boyutlar (80px - 120px)
                const width = Math.floor(Math.random() * 40) + 80;
                img.style.width = `${width}px`;
                img.style.height = `${Math.floor(width * 1.25)}px`;

                const leftPos = Math.random() * 85 + 5;
                img.style.left = `${leftPos}vw`;

                const duration = Math.random() * 5 + 8;
                img.style.animationDuration = `${duration}s`;

                photoContainer.appendChild(img);

                setTimeout(() => {
                    img.remove();
                }, (duration + 1) * 1000);
            }

            function triggerConfetti() {
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 45,
                        spread: 65,
                        origin: { x: 0.15, y: 0.5 },
                        colors: ['#f7d6c8', '#ffffff', '#e5b3a3', '#c58b7b']
                    });
                    confetti({
                        particleCount: 45,
                        spread: 65,
                        origin: { x: 0.85, y: 0.5 },
                        colors: ['#f7d6c8', '#ffffff', '#e5b3a3', '#c58b7b']
                    });
                }
            }

            cakeContainer.addEventListener('click', (e) => {
                triggerConfetti();
                
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 80,
                        startVelocity: 30,
                        spread: 360,
                        origin: {
                            x: e.clientX / window.innerWidth,
                            y: e.clientY / window.innerHeight
                        },
                        colors: ['#ffffff', '#f7d6c8', '#e5b3a3', '#ffd700']
                    });
                }
            });

            startBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                startCelebration();
            });

            introScreen.addEventListener('click', startCelebration);

            replayBtn.addEventListener('click', () => {
                introScreen.style.display = 'flex';
                introScreen.classList.remove('intro-fade-out');
                mainStage.classList.add('opacity-0', 'scale-95');
                mainStage.classList.remove('main-stage-in');
                if (photoRainInterval) clearInterval(photoRainInterval);
                photoContainer.innerHTML = '';
            });
        });
